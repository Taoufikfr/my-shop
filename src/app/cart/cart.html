<div class="cart-container">
  <h2>Your Shopping Cart 🛒</h2>

  <div *ngIf="items.length === 0" class="empty-msg">
    <p>Your cart is empty.</p>
    <a routerLink="/" class="btn-shop">Go Shopping</a>
  </div>

  <div *ngIf="items.length > 0">
    <div class="cart-item" *ngFor="let item of items; let i = index">
      <img [src]="item.image" [alt]="item.title" width="50">
      
      <div class="item-details">
        <h4>{{ item.title }}</h4>
        <p>{{ item.price | currency:'USD' }}</p>
      </div>

      <button (click)="removeItem(i)" class="btn-remove">❌</button>
    </div>

    <hr>
    
    <div class="total-section">
      <h3>Total: {{ total | currency:'USD' }}</h3>
      <button class="btn-checkout">Checkout</button>
    </div>
  </div>
</div>
