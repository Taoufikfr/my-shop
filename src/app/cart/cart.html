<div class="cart-container">
  <h2>Shopping Cart</h2>

  <div *ngIf="items.length === 0" class="empty-msg">
    Your cart is empty. <a routerLink="/">Go Shop!</a>
  </div>

  <div *ngFor="let item of items" class="cart-row">
    
    <img [src]="item.product.image" class="thumb">
    
    <div class="info">
      <h3>{{ item.product.title }}</h3>
      <p>Unit Price: {{ item.product.price | currency:'USD' }}</p>
    </div>

    <div class="qty-control">
      <button (click)="decrement(item)">-</button>
      <span>{{ item.quantity }}</span>
      <button (click)="increment(item)">+</button>
    </div>

    <div class="subtotal">
      {{ (item.product.price * item.quantity) | currency:'USD' }}
    </div>

    <button (click)="remove(item.product.id)" class="btn-remove">🗑️</button>
  </div>

  <div class="total-bar" *ngIf="items.length > 0">
    <h3>Total: {{ totalPrice | currency:'USD' }}</h3>
    <button class="btn-checkout">Checkout</button>
  </div>
</div>
