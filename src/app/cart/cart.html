<div class="cart-container">
  <h2>Your Shopping Cart</h2>

  <div *ngIf="items.length === 0">
    <p>Your cart is empty.</p>
    <a routerLink="/" class="btn">Go Shopping</a>
  </div>

  <div *ngIf="items.length > 0">
    <div *ngFor="let item of items; let i = index" class="cart-item">
      
      <div class="item-info">
        <h3>{{ item.title }}</h3>
        <p>{{ item.price | currency:'USD' }}</p>
      </div>

      <button (click)="removeItem(i)" class="btn-remove">Remove ❌</button>
    </div>

    <hr>

    <div class="total-section">
      <h3>Total: {{ total | currency:'USD' }}</h3>
      <button class="btn-checkout">Checkout</button>
    </div>
  </div>

</div>
